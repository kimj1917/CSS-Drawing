<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Drawing</title>

    <style>
        #sign {
            top: 20px;
            left: 300px;
            position: absolute;
            width: 300px;
            height: 300px;
            background: linear-gradient(to right, rgb(222, 222, 129), rgb(214, 147, 3));
            border-radius: 100px;
            filter: blur(100px);
            
        }

        #bigwindow{
            position: relative;
            width: 700px;
            height: 500px;
            background: linear-gradient(to top, rgb(223, 248, 255), rgb(128, 209, 250));
            overflow: hidden;
        }

        #building3 {
            left: 400px;
            position: absolute;
            width: 300px;
            height: 2000px;
            background: linear-gradient(to right, rgb(125, 118, 118), rgb(56, 53, 53));
            border: 1px solid black;
            overflow: hidden;
        }

        #building {
            top: 100px;
            position: absolute;
            width: 500px;
            height: 1000px;
            background: linear-gradient(to right, rgb(166, 161, 161), rgb(104, 102, 102));
            border: 1px solid black;
            overflow: hidden;
        }
        #building2 {
            top: 300px;
            left: 400px;
            position: absolute;
            width: 500px;
            height: 2000px;
            background: linear-gradient(to right, rgb(196, 191, 191), grey);
            border: 1px solid black;
            overflow: hidden;
        }

        .window {
            width: 100px;
            height: 200px;
            background-color: rgb(61, 59, 59);
            border: 10px black;
            margin: px;
            box-shadow: inset 4px 4px 8px black;
        }

        #window1 {
            position: absolute;
            top: 100px;
            left: 50px;
        }

        #window2 {
            position: absolute;
            top: 100px;
            left: 200px;
        }

        #window3 {
            position: absolute;
            top: 100px;
            left: 350px;
        }

        #sun {
            background-color: yellow;
            position: absolute;
            width: 1000px;
            height: 1000px;
            top: -600px;
            transform: rotate(45deg);
            filter:blur(50px)
            opacity(20%)

        }
        #sun2 {
            background-color: yellow;
            position: absolute;
            width: 1000px;
            height: 1000px;
            top: 50px;
            right: 100px; 
            transform: rotate(75deg); 
            filter:blur(20px)
            opacity(15%)

        }
        #sun3 {
            background-color: yellow;
            position: absolute;
            width: 1000px;
            height: 1000px;
            right: 30px; 
            filter:blur(20px)
            opacity(30%)

        }
    </style>
</head>
<body>

<div id="bigwindow">

    <div id="sign"></div>

<div id="building3">

    <div id="window1" class="window" ></div>
    <div id="window2" class="window" ></div>
    <div id="window3" class="window" ></div>

    <div id="sun3"></div>

</div>

<div id="building">

    <div id="window1" class="window" ></div>
    <div id="window2" class="window" ></div>
    <div id="window3" class="window" ></div>

    <div id="sun"></div>

</div>

<div id="building2">

    <div id="window1" class="window" ></div>
    <div id="window2" class="window" ></div>
    <div id="window3" class="window" ></div>

    <div id="sun2"></div>

</div>


</div>

</body>
</html>
